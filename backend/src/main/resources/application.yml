spring:
  application:
    name: ai-changeguard-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    banner-mode: console

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

logging:
  config: classpath:logback-spring.xml

changeguard:
  repository:
    allowed-base-directories: ${REPOSITORY_ALLOWED_BASE_DIRECTORIES:}
    max-directory-depth: ${REPOSITORY_MAX_DIRECTORY_DEPTH:15}
    max-file-inspection-count: ${REPOSITORY_MAX_FILE_INSPECTION_COUNT:50000}
  github:
    app-id: ${GITHUB_APP_ID:}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    private-key-pem: ${GITHUB_PRIVATE_KEY_PEM:}
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    rate-limit-threshold: ${GITHUB_RATE_LIMIT_THRESHOLD:50}
    connect-timeout-ms: ${GITHUB_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${GITHUB_READ_TIMEOUT_MS:10000}
  docker:
    enabled: ${DOCKER_ENABLED:true}
    image: ${DOCKER_IMAGE:maven:3.9-eclipse-temurin-21}
    default-timeout-seconds: ${DOCKER_DEFAULT_TIMEOUT_SECONDS:180}
    max-timeout-seconds: ${DOCKER_MAX_TIMEOUT_SECONDS:600}
    default-cpu-limit: ${DOCKER_DEFAULT_CPU_LIMIT:2.0}
    default-memory-limit: ${DOCKER_DEFAULT_MEMORY_LIMIT:2g}
    max-memory-limit: ${DOCKER_MAX_MEMORY_LIMIT:4g}
    network-disabled: ${DOCKER_NETWORK_DISABLED:true}
    max-log-size-bytes: ${DOCKER_MAX_LOG_SIZE_BYTES:512000}
    pids-limit: ${DOCKER_PIDS_LIMIT:256}
  risk:
    model-version: ${RISK_MODEL_VERSION:1.0.0}
    low-max-threshold: ${RISK_LOW_MAX_THRESHOLD:29}
    moderate-max-threshold: ${RISK_MODERATE_MAX_THRESHOLD:69}
